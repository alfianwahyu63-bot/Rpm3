<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Instalasi PWA – RPM2</title><style>:root{font-family:system-ui,sans-serif;color:#f8fafc;background:#0f172a}body{max-width:780px;margin:30px auto;padding:15px}h1{font-size:1.6rem}p{color:#cbd5e1;line-height:1.5}.item{background:#1e293b;border:1px solid #334155;padding:15px;border-radius:14px;margin:10px 0}.ok{color:#4ade80}.bad{color:#fb7185}.warn{color:#fbbf24}code{overflow-wrap:anywhere}a,button{color:#93c5fd}button{border:0;border-radius:10px;background:#4f46e5;color:white;padding:12px 16px;cursor:pointer}</style></head><body><h1>🔍 Cek Instalasi SalesPulse RPM2</h1><p>Buka halaman ini dari alamat GitHub Pages (HTTPS), bukan dari file HTML yang didownload. Pemeriksaan berikut tidak mengubah data penjualan.</p><div id="tests"></div><p><button onclick="location.reload()">↻ Periksa Ulang</button> &nbsp; <a href="./index.html">Buka Dashboard</a></p><script>
const root=document.getElementById('tests');function show(label,state,detail){const el=document.createElement('div');el.className='item';el.innerHTML='<b>'+label+'</b><div class="'+state+'">'+(state==='ok'?'✅ ':state==='bad'?'❌ ':'⚠️ ')+detail+'</div>';root.append(el)}
(async()=>{show('Alamat halaman',location.protocol==='https:'?'ok':'bad',location.href+' — PWA butuh HTTPS (kecuali localhost).');
for(const name of ['index.html','manifest.webmanifest','sw.js','icon-192.png','icon-512.png']){
 try{const r=await fetch('./'+name+'?cek='+Date.now(),{cache:'no-store'});const type=r.headers.get('content-type')||'unknown';if(!r.ok) throw Error('HTTP '+r.status);if(name.includes('.png')){const b=await r.blob();if(!type.includes('image/')||b.size<100)throw Error('File bukan gambar valid / '+type)}
 if(name==='manifest.webmanifest'){const m=await r.json();if(!m.icons||m.icons.length<2)throw Error('ikon manifest tidak lengkap');} if(name==='sw.js'&&type.includes('text/html'))throw Error('sw.js berisi halaman HTML (jalur salah)');
 show(name,'ok','Ditemukan (HTTP '+r.status+', '+type+')');}catch(e){show(name,'bad',String(e)+' — pastikan file ada di root repository dan sudah ter-deploy.')}}
if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('./sw.js');show('Service Worker','ok','Pendaftaran berhasil (status aktif dapat perlu refresh).')}catch(e){show('Service Worker','bad',String(e))}}else show('Service Worker','bad','Browser tidak mendukung Service Worker');
if(window.matchMedia('(display-mode: standalone)').matches)show('Status instalasi','ok','Aplikasi sudah berjalan dalam mode standalone.');else show('Status instalasi','warn','Belum dalam mode aplikasi. Buka dashboard memakai Chrome → menu ⋮ → Instal aplikasi / Tambahkan ke layar utama.');
})();
</script></body></html>
